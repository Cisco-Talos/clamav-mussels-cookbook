name: pdfium
version: "ab5a98e4b1d6885b896b12996bf2b37630505ad0"
source:
  none: true
mussels_version: "0.3"
type: recipe
platforms:
  Darwin:
    host:
      build_script:
        configure: |
          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          gclient sync --revision {version} --no-history --shallow
          cd pdfium
          mkdir -p out/Shared
          gn gen --args="\
          clang_use_chrome_plugins=false \
          is_debug=true \
          pdf_is_standalone=true \
          pdf_use_partition_alloc=false \
          treat_warnings_as_errors=false \
          is_component_build=false \
          is_official_build=false \
          pdf_enable_v8=false \
          pdf_enable_xfa=false \
          " out/Shared
        make: |
          ninja -C out/Shared pdfium
      dependencies: []
      required_tools:
        - make
        - clang
        - depot_tools
    host-static:
      build_script:
        configure: |
          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          gclient sync --revision {version} --no-history --shallow
          gclient runhooks
          cd pdfium
          mkdir -p out/Static
          gn gen --args="\
          clang_use_chrome_plugins=false \
          is_component_build=false \
          is_debug=false \
          use_custom_libcxx=false \
          pdf_enable_v8=false \
          pdf_enable_xfa=false \
          pdf_is_standalone=true \
          pdf_is_complete_lib=true \
          pdf_use_partition_alloc=false \
          target_cpu=\"arm64\" \
          target_os=\"mac\" \
          treat_warnings_as_errors=false \
          use_thin_archives=false" \
          out/Static
        make: |
          cd pdfium
          ninja -C out/Static pdfium
          cp out/Static/obj/libpdfium.a {install}/lib/libpdfium.a
      dependencies: []
      required_tools:
        - make
        - clang
        - depot_tools
  FreeBSD:
    host:
      build_script:
        configure: |
          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          gclient sync --revision {version} --no-history --nohooks
          cd pdfium
          gn gen --args="clang_use_chrome_plugins=false" {install}/lib
        make: |
          ninja -C {install}/lib pdfium
      dependencies: []
      required_tools:
        - gmake
        - clang
        - depot_tools
    host-static:
      build_script:
        configure: |
          echo "WARNING: static was specified, but static pdfium builds are experimental and not working; building dynamic pdfium instead."
          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          gclient sync --revision {version} --no-history --nohooks
          cd pdfium
          gn gen --args="clang_use_chrome_plugins=false" {install}/lib
        make: |
          ninja -C {install}/lib pdfium
      dependencies: []
      required_tools:
        - gmake
        - clang
        - depot_tools
  Linux:
    host:
      build_script:
        configure: |
          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          # Creates pdfium/DEPS, but skips the failing CIPD packages.
          gclient sync --revision {version} --no-history --shallow --nohooks --ignore-dep-type=cipd

          # Patch DEPS after it exists to remove unneeded 'reclient' chromium dependency not available for all architectures on Linux
          if ! sed -n "/'buildtools\/reclient': {{/,/^  }},/p" pdfium/DEPS | grep -q "'condition': 'False'"; then
            sed -i "/'buildtools\/reclient': {{/,/^  }},/s/    'dep_type': 'cipd',/    'dep_type': 'cipd',\n    'condition': 'False',/" pdfium/DEPS
          fi

          # Now install GN and the other CIPD deps, with reclient disabled.
          gclient sync --no-history --shallow --nohooks
          gclient runhooks

          cd pdfium
          mkdir -p out/Shared
          if [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
            export AR=ar
            export CC=gcc
            export CXX=g++
            export NM=nm
            export RANLIB=ranlib

            gn gen --args="\
            clang_use_chrome_plugins=false \
            is_debug=true \
            pdf_is_standalone=true \
            pdf_use_partition_alloc=false \
            treat_warnings_as_errors=false \
            is_component_build=false \
            is_official_build=false \
            pdf_enable_v8=false \
            pdf_enable_xfa=false \
            use_dbus=false \
            use_gio=false \
            use_glib=false \
            use_udev=false \
            custom_toolchain=\"//build/toolchain/linux/unbundle:default\" \
            host_toolchain=\"//build/toolchain/linux/unbundle:default\" \
            host_cpu=\"arm64\" \
            is_clang=false \
            target_cpu=\"arm64\" \
            use_clang_modules=false \
            use_custom_libcxx=false \
            use_lld=false \
            use_sysroot=false \
            " out/Shared
          else
            gn gen --args="\
            clang_use_chrome_plugins=false \
            is_debug=true \
            pdf_is_standalone=true \
            pdf_use_partition_alloc=false \
            treat_warnings_as_errors=false \
            is_component_build=false \
            is_official_build=false \
            pdf_enable_v8=false \
            pdf_enable_xfa=false \
            " out/Shared
          fi
        make: |
          cd pdfium
          ninja -C out/Shared pdfium
      dependencies: []
      required_tools:
        - make
        - gcc
        - depot_tools
    host-static:
      build_script:
        configure: |
          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          # Creates pdfium/DEPS, but skips the failing CIPD packages.
          gclient sync --revision {version} --no-history --shallow --nohooks --ignore-dep-type=cipd

          # Patch DEPS after it exists to remove unneeded 'reclient' chromium dependency not available for all architectures on Linux
          if ! sed -n "/'buildtools\/reclient': {{/,/^  }},/p" pdfium/DEPS | grep -q "'condition': 'False'"; then
            sed -i "/'buildtools\/reclient': {{/,/^  }},/s/    'dep_type': 'cipd',/    'dep_type': 'cipd',\n    'condition': 'False',/" pdfium/DEPS
          fi

          # Now install GN and the other CIPD deps, with reclient disabled.
          gclient sync --no-history --shallow --nohooks
          gclient runhooks

          cd pdfium
          mkdir -p out/Static
          if [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
            export AR=ar
            export CC=gcc
            export CXX=g++
            export NM=nm
            export RANLIB=ranlib

            gn gen --args="\
            clang_use_chrome_plugins=false \
            is_component_build=false \
            is_debug=false \
            use_custom_libcxx=false \
            pdf_enable_v8=false \
            pdf_enable_xfa=false \
            pdf_is_standalone=true \
            pdf_is_complete_lib=true \
            pdf_use_partition_alloc=false \
            target_os=\"linux\" \
            treat_warnings_as_errors=false \
            use_dbus=false \
            use_gio=false \
            use_glib=false \
            use_udev=false \
            custom_toolchain=\"//build/toolchain/linux/unbundle:default\" \
            host_toolchain=\"//build/toolchain/linux/unbundle:default\" \
            host_cpu=\"arm64\" \
            is_clang=false \
            target_cpu=\"arm64\" \
            use_clang_modules=false \
            use_lld=false \
            use_sysroot=false \
            use_thin_archives=false" \
            out/Static
          else
            gn gen --args="\
            clang_use_chrome_plugins=false \
            is_component_build=false \
            is_debug=false \
            use_custom_libcxx=false \
            pdf_enable_v8=false \
            pdf_enable_xfa=false \
            pdf_is_standalone=true \
            pdf_is_complete_lib=true \
            pdf_use_partition_alloc=false \
            target_os=\"linux\" \
            treat_warnings_as_errors=false \
            use_thin_archives=false" \
            out/Static
          fi
        make: |
          cd pdfium
          ninja -C out/Static pdfium
          cp out/Static/obj/libpdfium.a {install}/lib/libpdfium.a
      dependencies: []
      required_tools:
        - make
        - gcc
        - depot_tools
  Windows:
    arm64:
      build_script:
        configure: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          CALL vcvarsall.bat amd64_arm64
          set "PDFIUM_REQUIRED_WINSDK_VERSION=10.0.26100.0"
          set "PDFIUM_WINSDK_ROOT=C:\Program Files (x86)\Windows Kits\10"
          if not exist "%PDFIUM_WINSDK_ROOT%\Lib" set "PDFIUM_WINSDK_ROOT=C:\Program Files\Windows Kits\10"
          if not exist "%PDFIUM_WINSDK_ROOT%\Include\%PDFIUM_REQUIRED_WINSDK_VERSION%\shared\winapifamily.h" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% headers under "%PDFIUM_WINSDK_ROOT%\Include".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          if not exist "%PDFIUM_WINSDK_ROOT%\Include\%PDFIUM_REQUIRED_WINSDK_VERSION%\um\Windows.h" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% UM headers under "%PDFIUM_WINSDK_ROOT%\Include".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          if not exist "%PDFIUM_WINSDK_ROOT%\Include\%PDFIUM_REQUIRED_WINSDK_VERSION%\ucrt\corecrt.h" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% UCRT headers under "%PDFIUM_WINSDK_ROOT%\Include".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          if not exist "%PDFIUM_WINSDK_ROOT%\Lib\%PDFIUM_REQUIRED_WINSDK_VERSION%\um\arm64\ws2_32.lib" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% ARM64 UM libraries under "%PDFIUM_WINSDK_ROOT%\Lib".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          if not exist "%PDFIUM_WINSDK_ROOT%\Lib\%PDFIUM_REQUIRED_WINSDK_VERSION%\ucrt\arm64\libucrt.lib" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% ARM64 UCRT libraries under "%PDFIUM_WINSDK_ROOT%\Lib".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          if not exist "%PDFIUM_WINSDK_ROOT%\Debuggers\arm64\dbghelp.dll" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% ARM64 Debugging Tools under "%PDFIUM_WINSDK_ROOT%\Debuggers".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          set "WINDOWSSDKDIR=%PDFIUM_WINSDK_ROOT%"
          set "WindowsSdkDir=%PDFIUM_WINSDK_ROOT%"
          set "WindowsSDKVersion=%PDFIUM_REQUIRED_WINSDK_VERSION%\"
          set "WindowsSDKLibVersion=%PDFIUM_REQUIRED_WINSDK_VERSION%\"
          set "LIB=%PDFIUM_WINSDK_ROOT%\Lib\%PDFIUM_REQUIRED_WINSDK_VERSION%\um\arm64;%PDFIUM_WINSDK_ROOT%\Lib\%PDFIUM_REQUIRED_WINSDK_VERSION%\ucrt\arm64;%LIB%"
          set CIPD_CACHE_DIR=%USERPROFILE%\.mussels\cache\cipd
          if not exist "%CIPD_CACHE_DIR%" mkdir "%CIPD_CACHE_DIR%"
          CALL gclient.bat config --unmanaged https://pdfium.googlesource.com/pdfium.git
          CALL gclient.bat sync --revision {version} --no-history --shallow
          if exist .cipd attrib -R -S -H .cipd\* /S /D
          if exist pdfium\.git attrib -R -S -H pdfium\.git\* /S /D
          cd pdfium
          mkdir out\Static
          gn gen --args="\
          clang_use_chrome_plugins=false \
          is_component_build=false \
          is_debug=false \
          pdf_enable_v8=false \
          pdf_enable_xfa=false \
          pdf_is_complete_lib=true \
          pdf_is_standalone=true \
          pdf_use_partition_alloc=false \
          target_os=\"win\" \
          target_cpu=\"arm64\" \
          treat_warnings_as_errors=false \
          use_clang_modules=false \
          use_custom_libcxx=false \
          use_custom_libcxx_for_host=false \
          use_thin_archives=false \
          " out\Static
        make: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          CALL vcvarsall.bat amd64_arm64
          set "PDFIUM_REQUIRED_WINSDK_VERSION=10.0.26100.0"
          set "PDFIUM_WINSDK_ROOT=C:\Program Files (x86)\Windows Kits\10"
          if not exist "%PDFIUM_WINSDK_ROOT%\Lib" set "PDFIUM_WINSDK_ROOT=C:\Program Files\Windows Kits\10"
          if not exist "%PDFIUM_WINSDK_ROOT%\Include\%PDFIUM_REQUIRED_WINSDK_VERSION%\shared\winapifamily.h" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% headers under "%PDFIUM_WINSDK_ROOT%\Include".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          if not exist "%PDFIUM_WINSDK_ROOT%\Include\%PDFIUM_REQUIRED_WINSDK_VERSION%\um\Windows.h" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% UM headers under "%PDFIUM_WINSDK_ROOT%\Include".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          if not exist "%PDFIUM_WINSDK_ROOT%\Include\%PDFIUM_REQUIRED_WINSDK_VERSION%\ucrt\corecrt.h" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% UCRT headers under "%PDFIUM_WINSDK_ROOT%\Include".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          if not exist "%PDFIUM_WINSDK_ROOT%\Lib\%PDFIUM_REQUIRED_WINSDK_VERSION%\um\arm64\ws2_32.lib" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% ARM64 UM libraries under "%PDFIUM_WINSDK_ROOT%\Lib".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          if not exist "%PDFIUM_WINSDK_ROOT%\Lib\%PDFIUM_REQUIRED_WINSDK_VERSION%\ucrt\arm64\libucrt.lib" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% ARM64 UCRT libraries under "%PDFIUM_WINSDK_ROOT%\Lib".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          if not exist "%PDFIUM_WINSDK_ROOT%\Debuggers\arm64\dbghelp.dll" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% ARM64 Debugging Tools under "%PDFIUM_WINSDK_ROOT%\Debuggers".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
          )
          set "WINDOWSSDKDIR=%PDFIUM_WINSDK_ROOT%"
          set "WindowsSdkDir=%PDFIUM_WINSDK_ROOT%"
          set "WindowsSDKVersion=%PDFIUM_REQUIRED_WINSDK_VERSION%\"
          set "WindowsSDKLibVersion=%PDFIUM_REQUIRED_WINSDK_VERSION%\"
          set "LIB=%PDFIUM_WINSDK_ROOT%\Lib\%PDFIUM_REQUIRED_WINSDK_VERSION%\um\arm64;%PDFIUM_WINSDK_ROOT%\Lib\%PDFIUM_REQUIRED_WINSDK_VERSION%\ucrt\arm64;%LIB%"
          cd pdfium
          if exist ..\.cipd attrib -R -S -H ..\.cipd\* /S /D
          if exist .git attrib -R -S -H .git\* /S /D
          ninja -C out\Static pdfium
        install: |
          mkdir "{install}\lib"
          mkdir "{install}\include"
          if exist pdfium\out\Static\obj\pdfium.lib copy /Y pdfium\out\Static\obj\pdfium.lib "{install}\lib\pdfium.lib"
          if not exist "{install}\lib\pdfium.lib" exit /b 1
          xcopy /E /I /Y pdfium\public "{install}\include"
      dependencies: []
      required_tools:
        - visualstudio>=2019
        - depot_tools
        - windows_sdk_arm64_debugging_tools
        - windows_sdk_arm64_libraries>=10.0.26100.0
        - windows_sdk_headers>=10.0.26100.0
    x64:
      build_script:
        configure: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          CALL vcvarsall.bat amd64
          set "PDFIUM_REQUIRED_WINSDK_VERSION=10.0.26100.0"
          set "PDFIUM_WINSDK_ROOT=C:\Program Files (x86)\Windows Kits\10"
          if not exist "%PDFIUM_WINSDK_ROOT%\Lib" set "PDFIUM_WINSDK_ROOT=C:\Program Files\Windows Kits\10"
          if not exist "%PDFIUM_WINSDK_ROOT%\Include\%PDFIUM_REQUIRED_WINSDK_VERSION%\shared\winapifamily.h" (
            echo ERROR: PDFium requires Windows SDK %PDFIUM_REQUIRED_WINSDK_VERSION% headers under "%PDFIUM_WINSDK_ROOT%\Include".
            echo ERROR: Install Windows 10 SDK %PDFIUM_REQUIRED_WINSDK_VERSION% with C++ headers/libraries and Debugging Tools.
            exit /b 1
